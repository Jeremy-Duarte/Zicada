{% extends "layouts/base.html" %}
{% load static %}

{% block title %}Catálogo - Zicada{% endblock %}

{% block content %}
<div class="bg-black text-white font-opensans min-h-dvh">
    <div class="max-w-[1360px] mx-auto px-4 py-8 md:py-12">

        <div class="flex items-baseline justify-between gap-4 mb-8">
            <h1 class="text-3xl md:text-5xl font-extrabold tracking-tight">CATÁLOGO</h1>
            <span class="text-sm md:text-base text-gray-400 font-semibold whitespace-nowrap">{{ paginator.count }} PRODUCTOS</span>
        </div>

        <hr class="border-neutral-800 mb-6">

        <div class="flex flex-wrap items-center justify-between gap-4 mb-8">
            <div class="flex items-center gap-2" role="group" aria-label="Vista de productos">
                <button data-cols="1" class="layout-btn w-9 h-9 flex items-center justify-center rounded-lg border border-neutral-700 text-neutral-400 hover:text-white hover:border-white transition" aria-label="1 columna">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
                <button data-cols="2" class="layout-btn w-9 h-9 flex items-center justify-center rounded-lg border border-neutral-700 text-neutral-400 hover:text-white hover:border-white transition" aria-label="2 columnas">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 4h2v16H9zM4 6h2v12H4zM18 4h2v16h-2zM13 6h2v12h-2z"/></svg>
                </button>
                <button data-cols="3" class="layout-btn w-9 h-9 flex items-center justify-center rounded-lg border border-white text-white bg-zicada-accent transition" aria-label="3 columnas">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h2v12H4zM10 4h2v16h-2zM16 6h2v12h-2zM7 9h2v6H7zM13 9h2v6h-2z"/></svg>
                </button>
            </div>

            <div class="flex items-center gap-3">
                <label for="sort-select" class="text-sm text-gray-400 font-semibold whitespace-nowrap">ORDENAR POR</label>
                <select id="sort-select"
                    class="bg-neutral-900 text-white border border-neutral-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-zicada-accent">
                    {% for value, label in order_choices %}
                    <option value="{{ value }}" {% if current_order_by == value %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        {% include 'components/_product_list.html' %}

    </div>
</div>
{% endblock %}

{% block extra_js %}
{{ block.super }}
<script>
document.addEventListener('DOMContentLoaded', function () {
    var container = document.getElementById('products-grid');
    if (!container) return;

    document.querySelectorAll('.layout-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
            var cols = parseInt(this.getAttribute('data-cols'));
            document.querySelectorAll('.layout-btn').forEach(function (b) {
                b.classList.remove('bg-zicada-accent', 'border-white', 'text-white');
                b.classList.add('border-neutral-700', 'text-neutral-400');
            });
            this.classList.add('bg-zicada-accent', 'border-white', 'text-white');
            this.classList.remove('border-neutral-700', 'text-neutral-400');

            container.className = 'grid gap-8';
            if (cols === 1) container.classList.add('grid-cols-1');
            else if (cols === 2) container.classList.add('grid-cols-1', 'sm:grid-cols-2');
            else container.classList.add('grid-cols-1', 'sm:grid-cols-2', 'lg:grid-cols-3');
        });
    });

    var sortSelect = document.getElementById('sort-select');
    if (sortSelect) {
        sortSelect.addEventListener('change', function () {
            var params = new URLSearchParams(window.location.search);
            params.set('order_by', this.value);
            params.delete('page');
            window.location.href = '?' + params.toString();
        });
    }
});
</script>
{% endblock %}
