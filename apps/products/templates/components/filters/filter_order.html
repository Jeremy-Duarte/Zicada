<div>
    <label for="order-by" class="block text-zicada-light text-sm font-medium mb-2">🔄 Ordenar por</label>
    <select id="order-by" name="order_by" class="w-full px-3 py-2 bg-white border border-gray-300 rounded-lg focus:outline-none focus:border-zicada-accent focus:ring-1 focus:ring-zicada-accent text-gray-900">
        {% for value, label in choices %}
        <option value="{{ value }}" {% if current == value %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
    </select>
</div>
