<div>
    <label class="block text-sm font-medium text-gray-700 mb-2">🔄 Ordenar por</label>
    <select name="order_by" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-zicada-accent">
        {% for value, label in order_choices %}
        <option value="{{ value }}" {% if current_order == value %}selected{% endif %}>
            {{ label }}
        </option>
        {% endfor %}
    </select>
</div>
