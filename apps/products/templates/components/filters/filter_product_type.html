<div>
    <label class="block text-sm font-medium text-white mb-2">🏷️ Tipo de producto</label>
    <select name="product_type" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-zicada-accent">
        <option value="">Todos</option>
        {% for type in types %}
        <option value="{{ type }}" {% if current == type %}selected{% endif %}>
            {% if type == 'fabrica' %}Producto de fábrica
            {% elif type == 'coleccion_limitada' %}Colección limitada
            {% else %}{{ type }}{% endif %}
        </option>
        {% endfor %}
    </select>
</div>
