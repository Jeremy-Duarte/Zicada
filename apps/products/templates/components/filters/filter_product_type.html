<div>
    <label for="product-type" class="block text-zicada-light text-sm font-medium mb-2">🏷️ Tipo de producto</label>
    <select id="product-type" name="product_type" class="w-full px-3 py-2 bg-white border border-gray-300 rounded-lg focus:outline-none focus:border-zicada-accent focus:ring-1 focus:ring-zicada-accent text-gray-900">
        <option value="">Todos</option>
        {% for type in types %}
        <option value="{{ type }}" {% if current == type %}selected{% endif %}>
            {% if type == 'fabrica' %}Producto de fábrica{% elif type == 'coleccion_limitada' %}Colección limitada{% else %}{{ type }}{% endif %}
        </option>
        {% endfor %}
    </select>
</div>
