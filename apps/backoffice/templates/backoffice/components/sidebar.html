{% load static %}
<aside class="w-72 bg-gray-900 text-white flex flex-col shadow-xl z-10 overflow-y-auto [&::-webkit-scrollbar]:w-1.5 [&::-webkit-scrollbar-track]:bg-gray-800 [&::-webkit-scrollbar-thumb]:bg-gray-600 [&::-webkit-scrollbar-thumb:hover]:bg-gray-500">
    
    <div class="p-5 border-b border-gray-800">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 flex items-center justify-center">
                <img src="{% static 'img/icons/favicon.ico' %}" alt="Zicada" class="w-8 h-8 object-contain">
            </div>
            <div>
                <span class="font-bold text-lg tracking-tight block">Zicada</span>
                <span class="text-xs text-gray-500">Backoffice</span>
            </div>
        </div>
    </div>

    <nav class="flex-1 px-4 py-6">
        <div class="space-y-6">
            <div>
                <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3 px-3">Principal</p>
                <div class="space-y-1">
                    <a href="{% url 'backoffice:dashboard' %}" 
                       class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all duration-200 
                              {% if section == 'dashboard' %}
                                  bg-zicada-accent text-white shadow-md
                              {% else %}
                                  text-gray-400 hover:bg-gray-800 hover:text-white
                              {% endif %}">
                        <i class="fas fa-chart-line w-5 text-base"></i>
                        <span>Dashboard</span>
                    </a>
                </div>
            </div>

            <div>
                <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3 px-3">Gestión</p>
                <div class="space-y-1">
                    <a href="{% url 'backoffice:orders' %}" 
                       class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all duration-200
                              {% if section == 'orders' %}
                                  bg-zicada-accent text-white shadow-md
                              {% else %}
                                  text-gray-400 hover:bg-gray-800 hover:text-white
                              {% endif %}">
                        <i class="fas fa-truck w-5 text-base"></i>
                        <span>Pedidos</span>
                    </a>
                    <a href="{% url 'backoffice:products' %}" 
                       class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all duration-200
                              {% if section == 'products' %}
                                  bg-zicada-accent text-white shadow-md
                              {% else %}
                                  text-gray-400 hover:bg-gray-800 hover:text-white
                              {% endif %}">
                        <i class="fas fa-tshirt w-5 text-base"></i>
                        <span>Productos</span>
                    </a>
                    <a href="{% url 'backoffice:users' %}" 
                       class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all duration-200
                              {% if section == 'users' %}
                                  bg-zicada-accent text-white shadow-md
                              {% else %}
                                  text-gray-400 hover:bg-gray-800 hover:text-white
                              {% endif %}">
                        <i class="fas fa-users w-5 text-base"></i>
                        <span>Entregadores</span>
                    </a>
                </div>
            </div>

            <!-- Sección: Configuración -->
            <div>
                <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3 px-3">Sistema</p>
                <div class="space-y-1">
                    <a href="{% url 'backoffice:config' %}" 
                       class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all duration-200
                              {% if section == 'config' %}
                                  bg-zicada-accent text-white shadow-md
                              {% else %}
                                  text-gray-400 hover:bg-gray-800 hover:text-white
                              {% endif %}">
                        <i class="fas fa-sliders-h w-5 text-base"></i>
                        <span>Configuración</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="p-4 border-t border-gray-800 mt-auto">
        <div class="bg-gray-800 rounded-xl p-3">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-gray-700 rounded-full flex items-center justify-center">
                    <i class="fas fa-user text-gray-400 text-sm"></i>
                </div>
                <div class="flex-1 min-w-0">
                    <p class="text-sm font-medium text-white truncate">
                        {{ request.user.get_full_name|default:request.user.username }}
                    </p>
                    <p class="text-xs text-gray-400">
                        {% if request.user.is_staff %}Administrador{% else %}Entregador{% endif %}
                    </p>
                </div>
                <a href="{% url 'core:staff_logout' %}" class="text-gray-400 hover:text-red-400 transition" title="Cerrar sesión">
                    <i class="fas fa-sign-out-alt"></i>
                </a>
            </div>
        </div>
    </div>
</aside>
