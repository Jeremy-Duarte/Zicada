{% load static %}
<div class="bg-white rounded-xl shadow-sm p-5 border-l-4 border-{{ color|default:'zicada-accent' }}">
    <div class="flex justify-between items-start">
        <div>
            <p class="text-gray-500 text-sm font-medium mb-1">{{ title|default:"Estadística" }}</p>
            <p class="text-3xl font-bold text-gray-800">{{ value|default:"0" }}</p>
            {% if subtitle %}
            <p class="text-xs text-gray-400 mt-2">{{ subtitle }}</p>
            {% endif %}
        </div>
        <div class="w-10 h-10 bg-{{ icon_bg|default:'gray-100' }} rounded-lg flex items-center justify-center">
            <i class="fas fa-{{ icon|default:'chart-line' }} text-blue-500 text-lg"></i>
        </div>
    </div>
    {% if change %}
    <div class="mt-3 flex items-center gap-1 text-xs">
        <span class="{% if change > 0 %}text-green-500{% else %}text-red-500{% endif %}">
            <i class="fas fa-arrow-{% if change > 0 %}up{% else %}down{% endif %}"></i> {{ change }}%
        </span>
        <span class="text-gray-400">vs mes anterior</span>
    </div>
    {% endif %}
</div>
