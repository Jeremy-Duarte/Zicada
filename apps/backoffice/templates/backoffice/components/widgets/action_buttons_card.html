{% load static %}
<div class="grid grid-cols-1 md:grid-cols-3 gap-6 my-8">
    {% for button in buttons %}
    <a href="{{ button.url }}" 
       class="group flex flex-col items-center justify-center p-8 bg-gradient-to-br from-{{ button.gradient_from|default:'zicada-accent' }} to-{{ button.gradient_to|default:'zicada-accent/80' }} rounded-3xl shadow-lg hover:shadow-2xl transition-all duration-300 transform hover:-translate-y-1 text-center min-h-[180px]">
        <div class="w-20 h-20 bg-white/20 rounded-full flex items-center justify-center mb-4 group-hover:scale-110 transition-transform duration-300 backdrop-blur-sm">
            <i class="fas fa-{{ button.icon }} text-4xl text-white"></i>
        </div>
        <h3 class="text-white font-bold text-xl mb-2">{{ button.title }}</h3>
        <p class="text-white/80 text-sm">{{ button.description|default:"" }}</p>
        {% if button.badge %}
        <span class="mt-3 inline-block bg-white/20 backdrop-blur-sm px-3 py-1 rounded-full text-xs font-semibold text-white">
            {{ button.badge }}
        </span>
        {% endif %}
    </a>
    {% endfor %}
</div>
