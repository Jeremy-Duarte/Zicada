{% load static %}
<div class="bg-white rounded-xl shadow-sm p-5">
    <div class="flex justify-between items-center mb-4">
        <h3 class="text-gray-800 font-semibold">{{ title|default:"Gráfico" }}</h3>
        {% if action %}
        <a href="{{ action.url }}" class="text-xs text-zicada-accent hover:underline">{{ action.label }}</a>
        {% endif %}
    </div>
    <div class="w-full overflow-x-auto">
        <div id="{{ chart_id|default:'chart-container' }}" 
             class="min-w-[300px] w-full mx-auto"
             style="height: 400px;"
             data-chart-type="{{ chart_type|default:'line' }}"
             data-yaxis-label="{{ yaxis_label|default:'COP' }}">
        </div>
    </div>
</div>

{{ chart_data|json_script:chart_id }}
