{% load static %}
<div class="bg-white rounded-xl shadow-sm overflow-hidden hover:shadow-md transition">
    <div class="px-5 py-4 border-b border-gray-100 bg-gradient-to-r from-gray-50 to-white">
        <h3 class="text-gray-800 font-semibold flex items-center gap-2">
            {% if icon %}
            <i class="fas fa-{{ icon }} text-zicada-accent text-sm"></i>
            {% endif %}
            {{ title|default:"Información" }}
        </h3>
    </div>
    <div class="divide-y divide-gray-100">
        {% for item in items %}
        <div class="px-5 py-4 flex items-center justify-between hover:bg-gray-50 transition">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-{{ item.icon_bg|default:'gray-100' }} flex items-center justify-center">
                    <i class="fas fa-{{ item.icon|default:'info-circle' }} text-{{ item.icon_color|default:'zicada-accent' }} text-sm"></i>
                </div>
                <span class="text-gray-600 font-medium">{{ item.label }}</span>
            </div>
            <div class="text-right">
                <span class="text-lg font-bold text-gray-900">{{ item.value }}</span>
                {% if item.sub_value %}
                <p class="text-xs text-gray-400">{{ item.sub_value }}</p>
                {% endif %}
            </div>
        </div>
        {% endfor %}
    </div>
</div>
