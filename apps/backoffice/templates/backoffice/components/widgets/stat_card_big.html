{% load static %}
<div class="bg-white rounded-xl shadow-sm hover:shadow-md transition overflow-hidden h-full flex flex-col">
    <div class="p-6 text-center flex-1 flex flex-col items-center justify-center">
        <div class="relative inline-block">
            <div class="w-32 h-32 rounded-full bg-gradient-to-br from-{{ ring_color|default:'zicada-accent' }}/10 to-{{ ring_color|default:'zicada-accent' }}/5 flex items-center justify-center mx-auto">
                <div class="text-4xl md:text-5xl font-bold text-{{ value_color|default:'zicada-accent' }}">
                    {{ value|default:"0" }}
                </div>
            </div>
            {% if icon %}
            <div class="absolute -bottom-2 -right-2 w-8 h-8 rounded-full bg-{{ icon_bg|default:'zicada-accent' }} flex items-center justify-center shadow-md">
                <i class="fas fa-{{ icon }} text-white text-xs"></i>
            </div>
            {% endif %}
        </div>
        
        <p class="text-gray-700 font-bold text-lg mt-4">{{ label|default:"Estadística" }}</p>
        <p class="text-xs text-gray-400 mt-1">{{ description|default:"" }}</p>
    </div>
    
    {% if stats_list %}
    <div class="border-t border-gray-100 bg-gray-50 mt-auto">
        <div class="flex divide-x divide-gray-100">
            {% for stat in stats_list %}
            <div class="flex-1 p-3 text-center">
                <div class="flex items-center justify-center gap-1 mb-1">
                    <div class="w-2 h-2 rounded-full bg-{{ stat.color|default:'gray-400' }}"></div>
                    <p class="text-xs text-gray-400">{{ stat.label }}</p>
                </div>
                <p class="text-sm font-bold text-gray-800">{{ stat.value }}</p>
            </div>
            {% endfor %}
        </div>
    </div>
    {% endif %}
</div>
