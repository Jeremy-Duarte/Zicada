{% load static %}
<div class="bg-white rounded-xl shadow-sm overflow-hidden">
    <div class="px-5 py-4 border-b border-gray-100 flex justify-between items-center">
        <h3 class="text-gray-800 font-semibold">{{ title|default:"Actividad reciente" }}</h3>
        {% if view_all_url %}
        <a href="{{ view_all_url }}" class="text-xs text-zicada-accent hover:underline">Ver todos</a>
        {% endif %}
    </div>
    <div class="divide-y divide-gray-100">
        {% for item in items %}
        <div class="px-5 py-3 hover:bg-gray-50 transition flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-full bg-{{ item.icon_bg|default:'gray-100' }} flex items-center justify-center">
                    <i class="fas fa-{{ item.icon|default:'box' }} text-{{ item.icon_color|default:'zicada-accent' }} text-sm"></i>
                </div>
                <div>
                    <p class="text-sm font-medium text-gray-800">{{ item.title }}</p>
                    <p class="text-xs text-gray-400">{{ item.subtitle|default:"" }}</p>
                </div>
            </div>
            <div class="text-right">
                <p class="text-sm font-semibold text-gray-800">{{ item.value|default:"" }}</p>
                <p class="text-xs text-gray-400">{{ item.date|default:"" }}</p>
            </div>
        </div>
        {% empty %}
        <div class="px-5 py-8 text-center text-gray-400 text-sm">
            <i class="fas fa-inbox text-2xl mb-2 block"></i>
            No hay registros recientes
        </div>
        {% endfor %}
    </div>
</div>
