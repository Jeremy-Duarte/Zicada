{% load static %}
<div class="max-w-lg mx-auto mt-10">
  <div class="bg-white rounded-xl shadow-sm p-8 text-center">
    <div class="w-12 h-12 mx-auto bg-red-100 rounded-full flex items-center justify-center mb-4">
      <i class="fas fa-exclamation-triangle text-red-600"></i>
    </div>
    <h2 class="text-xl font-bold text-gray-900 mb-2">{{ title }}</h2>
    <p class="text-sm text-gray-500 mb-6">{{ question }} <strong>"{{ object_display }}"</strong>?</p>

    {% if warning %}
    <div class="bg-yellow-50 text-yellow-700 p-3 rounded-lg text-sm mb-4">{{ warning }}</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      {{ form }}
      <div class="flex justify-center gap-3">
        {% if cancel_args %}
          <a href="{% url cancel_url cancel_args.0 %}" class="inline-flex items-center justify-center px-5 py-2 text-sm border border-gray-300 text-gray-700 bg-white font-medium rounded-xl hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-gray-400 focus:ring-offset-2 transition-all duration-150">Cancelar</a>
        {% else %}
          <a href="{% url cancel_url %}" class="inline-flex items-center justify-center px-5 py-2 text-sm border border-gray-300 text-gray-700 bg-white font-medium rounded-xl hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-gray-400 focus:ring-offset-2 transition-all duration-150">Cancelar</a>
        {% endif %}
        <button type="submit" class="inline-flex items-center justify-center px-5 py-2 text-sm bg-red-600 text-white font-medium rounded-xl hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2 transition-all duration-150">{{ btn_text|default:'Confirmar' }}</button>
      </div>
    </form>
  </div>
</div>
