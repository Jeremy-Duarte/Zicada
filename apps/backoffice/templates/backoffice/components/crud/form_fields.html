{% load static %}
<form method="post" class="space-y-5" {% if form.is_multipart %}enctype="multipart/form-data"{% endif %}>
    {% csrf_token %}
    {% for field in form %}
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">{{ field.label }}{% if field.field.required %} <span class="text-red-500">*</span>{% endif %}</label>
        {{ field }}
        {% if field.help_text %}
        <p class="text-xs text-gray-400 mt-1">{{ field.help_text }}</p>
        {% endif %}
        {% for error in field.errors %}
        <p class="text-red-500 text-xs mt-1">{{ error }}</p>
        {% endfor %}
    </div>
    {% endfor %}
    <div class="flex justify-end gap-3 pt-4">
        <a href="{% url cancel_url %}" class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition">Cancelar</a>
        <button type="submit" class="bg-zicada-accent hover:bg-opacity-90 text-white px-6 py-2 rounded-lg transition">{{ submit_label|default:"Guardar" }}</button>
    </div>
</form>
