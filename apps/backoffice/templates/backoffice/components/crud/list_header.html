{% load static %}
<div class="flex flex-wrap justify-between items-center gap-4">
    <h1 class="text-2xl font-bold text-gray-800">{{ title }}</h1>
    {% if create_url %}
    <a href="{% url create_url %}" class="bg-zicada-accent hover:bg-opacity-90 text-white px-4 py-2 rounded-lg transition flex items-center gap-2">
        <i class="fas fa-plus text-sm"></i> {{ create_label|default:"Nuevo" }}
    </a>
    {% endif %}
</div>
