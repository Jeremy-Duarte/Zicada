{% extends "layouts/base.html" %}
{% load static %}

{% block title %}Carrito de compras - Zicada{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/orders/cart_detail.css' %}">
{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8 max-w-7xl">
    <h1 class="font-poppins text-3xl font-bold text-gray-900 mb-8">Tu carrito</h1>
    
    <div id="cart-container">
        {% include "orders/cart_partial.html" %}
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    globalThis.cartConfig = {
        updateUrl: "{% url 'orders:cart_update' %}",
        removeUrl: "{% url 'orders:cart_remove' %}",
        checkoutUrl: "{% url 'orders:checkout' %}",
        csrfToken: "{{ csrf_token|escapejs }}"
    };
</script>
<script src="{% static 'js/orders/cart_detail.js' %}"></script>
{% endblock %}
