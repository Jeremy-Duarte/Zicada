{% load static %}

<nav id="main-navbar" class="{% if is_home %}bg-transparent{% else %}bg-black bg-opacity-90{% endif %} hover:bg-black hover:bg-opacity-100 text-white sticky top-0 z-50 transition-all duration-300 flex justify-center" style="min-height: 16.666vh;" aria-label="Navegación principal">
    <div class="w-full px-4 md:px-8 flex items-center justify-between">
        
        <!-- Izquierda: Iconos -->
        <div class="flex items-center gap-4 md:gap-6">
            <div class="relative">
                {% include 'components/cart_icon.html' %}
            </div>
            
            <!-- Desktop Search - Usar <form> semántico -->
            <form action="{% url 'products:catalog' %}" method="GET" class="hidden md:block" aria-label="Búsqueda de productos">
                <div class="relative">
                    <label for="search-desktop" class="sr-only">Buscar productos en el catálogo</label>
                    <input type="text" 
                           name="search" 
                           id="search-desktop"
                           placeholder="Buscar..." 
                           class="bg-white/15 backdrop-blur-sm text-white placeholder:text-gray-300 rounded-full pl-4 pr-10 py-2 w-48 lg:w-72 text-sm focus:outline-none focus:ring-2 focus:ring-zicada-accent transition-all hover:bg-white/25">
                    <button type="submit" aria-label="Realizar búsqueda" class="absolute right-3 top-1/2 -translate-y-1/2">
                        <svg class="w-4 h-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                    </button>
                </div>
            </form>
            
            <!-- Staff Login Icon -->
            <a href="{% url 'core:staff_login' %}" class="hover:text-zicada-accent transition opacity-80 hover:opacity-100" aria-label="Acceso de personal">
                <svg class="w-6 h-6 md:w-7 md:h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                </svg>
            </a>
            
            <!-- Mobile Search Button -->
            <button id="mobile-search-btn" class="md:hidden text-white hover:text-zicada-accent transition" aria-label="Abrir buscador">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
            </button>
        </div>
        
        <!-- Centro: Logo -->
        <div class="absolute left-1/2 transform -translate-x-1/2">
            <a href="{% url 'home' %}" aria-label="ZICADA - Ir al inicio">
                <img src="{% static 'img/icons/no-opacity-icon.png' %}" alt="Logo ZICADA" class="h-10 md:h-14 w-auto hover:opacity-80 transition">
            </a>
        </div>
        
        <!-- Derecha: Navegación Desktop -->
        <div class="hidden md:flex items-center gap-5 lg:gap-8">
            <!-- Diferenciar aria-label para desktop vs mobile -->
            <a href="{% url 'products:catalog' %}" class="hover:text-zicada-accent transition text-sm lg:text-base whitespace-nowrap" aria-label="Ir al catálogo de productos - versión escritorio">CATÁLOGO</a>
            <a href="{% url 'products:collections_list' %}" class="hover:text-zicada-accent transition text-sm lg:text-base whitespace-nowrap" aria-label="Ver colecciones - versión escritorio">COLECCIONES</a>
            <a href="{% url 'core:about' %}" class="hover:text-zicada-accent transition text-sm lg:text-base whitespace-nowrap" aria-label="Conocer sobre nosotros - versión escritorio">NOSOTROS</a>
            <a href="{% url 'core:contact' %}" class="hover:text-zicada-accent transition text-sm lg:text-base whitespace-nowrap" aria-label="Contactar con ZICADA - versión escritorio">CONTACTO</a>
        </div>
        
        <!-- Mobile Menu Button -->
        <div class="md:hidden">
            <button id="mobile-menu-button" class="focus:outline-none" aria-label="Abrir menú de navegación móvil" aria-expanded="false" aria-controls="mobile-menu">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
        </div>
    </div>
    
    <!-- Mobile Navigation - Usar <nav> semántico -->
    <nav id="mobile-menu" class="hidden md:hidden bg-black bg-opacity-95 backdrop-blur-md py-4 px-6 flex flex-col gap-3" aria-label="Menú de navegación móvil">
        <!-- aria-label diferenciado para mobile -->
        <a href="{% url 'products:catalog' %}" class="hover:text-zicada-accent transition py-1" aria-label="Ir al catálogo de productos - versión móvil">CATÁLOGO</a>
        <a href="{% url 'products:collections_list' %}" class="hover:text-zicada-accent transition py-1" aria-label="Ver colecciones - versión móvil">COLECCIONES</a>
        <a href="{% url 'core:about' %}" class="hover:text-zicada-accent transition py-1" aria-label="Conocer sobre nosotros - versión móvil">NOSOTROS</a>
        <a href="{% url 'core:contact' %}" class="hover:text-zicada-accent transition py-1" aria-label="Contactar con ZICADA - versión móvil">CONTACTO</a>
        
        <a href="{% url 'core:staff_login' %}" class="flex items-center gap-2 text-gray-300 hover:text-zicada-accent transition py-2 pt-3 border-t border-white/15 mt-1" aria-label="Acceso de personal - versión móvil">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
            </svg>
            <span>Acceso Staff</span>
        </a>
        
        <!-- Mobile Search Form -->
        <form action="{% url 'products:catalog' %}" method="GET" class="pt-2" aria-label="Búsqueda de productos móvil">
            <label for="search-mobile" class="sr-only">Buscar productos en el catálogo - móvil</label>
            <input type="text" 
                   name="search" 
                   id="search-mobile"
                   placeholder="Buscar productos..." 
                   class="w-full bg-white/15 text-white placeholder:text-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-zicada-accent">
        </form>
    </nav>
</nav>

<dialog id="search-modal" class="fixed inset-0 bg-black bg-opacity-98 z-50 hidden items-start justify-center pt-20 px-4 w-full h-full border-0" aria-label="Buscador de productos">
    <div class="w-full max-w-md mx-auto">
        <form action="{% url 'products:catalog' %}" method="GET" class="relative" aria-label="Búsqueda en ZICADA">
            <label for="search-input-modal" class="sr-only">Buscar en ZICADA</label>
            <input type="text" 
                   name="search" 
                   id="search-input-modal"
                   placeholder="Buscar en ZICADA..." 
                   class="w-full bg-white/20 text-white placeholder:text-gray-300 rounded-full px-5 py-3 text-lg focus:outline-none focus:ring-2 focus:ring-zicada-accent" 
                   autofocus>
            <button type="submit" aria-label="Realizar búsqueda en ZICADA" class="absolute right-4 top-1/2 -translate-y-1/2">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
            </button>
        </form>
        <button id="close-search-modal" class="absolute top-6 right-6 text-white text-2xl" aria-label="Cerrar buscador de productos">&times;</button>
    </div>
</dialog>

{% block extra_js %}
<script src="{% static 'js/core/header.js' %}" defer></script>
{% endblock %}
