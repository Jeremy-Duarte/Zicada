{% load static %}
<nav class="bg-transparent hover:bg-black hover:bg-opacity-90 text-white sticky top-0 z-50 transition-all duration-300 flex justify-center" style="min-height: 16.666vh;">
    <div class="w-full px-4 md:px-8 flex items-center justify-between">
        
        <!-- Izquierda: Iconos -->
        <div class="flex items-center gap-4 md:gap-6">
            <div class="relative">
                {% include 'components/cart_icon.html' %}
            </div>
            
            <form action="{% url 'products:catalog' %}" method="GET" class="hidden md:block">
                <div class="relative">
                    <input type="text" name="search" placeholder="Buscar..." 
                           class="bg-white/15 backdrop-blur-sm text-white placeholder:text-gray-300 rounded-full pl-4 pr-10 py-2 w-48 lg:w-72 text-sm focus:outline-none focus:ring-2 focus:ring-zicada-accent transition-all hover:bg-white/25">
                    <button type="submit" class="absolute right-3 top-1/2 -translate-y-1/2">
                        <svg class="w-4 h-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                    </button>
                </div>
            </form>
            
            <a href="{% url 'core:staff_login' %}" class="hover:text-zicada-accent transition opacity-80 hover:opacity-100">
                <svg class="w-6 h-6 md:w-7 md:h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                </svg>
            </a>
            
            <button id="mobile-search-btn" class="md:hidden text-white hover:text-zicada-accent transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
            </button>
        </div>
        
        <!-- Centro: Logo -->
        <div class="absolute left-1/2 transform -translate-x-1/2">
            <a href="{% url 'home' %}">
                <img src="{% static 'img/icons/favicon.ico' %}" alt="ZICADA" class="h-10 md:h-14 w-auto hover:opacity-80 transition">
            </a>
        </div>
        
        <!-- Derecha: Navegación -->
        <div class="hidden md:flex items-center gap-5 lg:gap-8">
            <a href="{% url 'products:catalog' %}" class="hover:text-zicada-accent transition text-sm lg:text-base whitespace-nowrap">Catálogo</a>
            <a href="{% url 'products:collections_list' %}" class="hover:text-zicada-accent transition text-sm lg:text-base whitespace-nowrap">Colecciones</a>
            <a href="{% url 'core:about' %}" class="hover:text-zicada-accent transition text-sm lg:text-base whitespace-nowrap">Nosotros</a>
            <a href="{% url 'core:contact' %}" class="hover:text-zicada-accent transition text-sm lg:text-base whitespace-nowrap">Contacto</a>
        </div>
        
        <!-- Mobile menu button -->
        <div class="md:hidden">
            <button id="mobile-menu-button" class="focus:outline-none">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
        </div>
    </div>
    
    <!-- Mobile Navigation -->
    <div id="mobile-menu" class="hidden md:hidden bg-black bg-opacity-95 backdrop-blur-md py-4 px-6 flex flex-col gap-3">
        <a href="{% url 'products:catalog' %}" class="hover:text-zicada-accent transition py-1">Catálogo</a>
        <a href="{% url 'products:collections_list' %}" class="hover:text-zicada-accent transition py-1">Colecciones</a>
        <a href="{% url 'core:about' %}" class="hover:text-zicada-accent transition py-1">Nosotros</a>
        <a href="{% url 'core:contact' %}" class="hover:text-zicada-accent transition py-1">Contacto</a>
        
        <a href="{% url 'core:staff_login' %}" class="flex items-center gap-2 text-gray-300 hover:text-zicada-accent transition py-2 pt-3 border-t border-white/15 mt-1">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
            </svg>
            <span>Acceso Staff</span>
        </a>
        
        <form action="{% url 'products:catalog' %}" method="GET" class="pt-2">
            <input type="text" name="search" placeholder="Buscar productos..." 
                   class="w-full bg-white/15 text-white placeholder:text-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-zicada-accent">
        </form>
    </div>
</nav>

<!-- Search Modal Mobile -->
<div id="search-modal" class="fixed inset-0 bg-black bg-opacity-98 z-50 hidden items-start justify-center pt-20 px-4">
    <div class="w-full max-w-md">
        <form action="{% url 'products:catalog' %}" method="GET" class="relative">
            <input type="text" name="search" placeholder="Buscar en ZICADA..." 
                   class="w-full bg-white/20 text-white placeholder:text-gray-300 rounded-full px-5 py-3 text-lg focus:outline-none focus:ring-2 focus:ring-zicada-accent" 
                   autofocus>
            <button type="submit" class="absolute right-4 top-1/2 -translate-y-1/2">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
            </button>
        </form>
        <button id="close-search-modal" class="absolute top-6 right-6 text-white text-2xl">&times;</button>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const menuButton = document.getElementById('mobile-menu-button');
        const mobileMenu = document.getElementById('mobile-menu');
        if (menuButton && mobileMenu) {
            menuButton.addEventListener('click', () => {
                mobileMenu.classList.toggle('hidden');
            });
        }
        
        const searchBtn = document.getElementById('mobile-search-btn');
        const searchModal = document.getElementById('search-modal');
        const closeModal = document.getElementById('close-search-modal');
        
        if (searchBtn && searchModal && closeModal) {
            searchBtn.addEventListener('click', () => {
                searchModal.classList.remove('hidden');
                searchModal.classList.add('flex');
            });
            closeModal.addEventListener('click', () => {
                searchModal.classList.add('hidden');
                searchModal.classList.remove('flex');
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && searchModal.classList.contains('flex')) {
                    searchModal.classList.add('hidden');
                    searchModal.classList.remove('flex');
                }
            });
        }
    });
</script>
