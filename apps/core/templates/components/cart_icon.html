{% load static %}

<!-- Icono del carrito -->
<div id="cart-icon-wrapper" class="relative">
    <a href="#" id="cart-icon" class="relative hover:text-zicada-accent transition block">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 md:h-7 md:w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-1.5 6M17 13l1.5 6M9 21h6M6 21h.01M18 21h.01" />
        </svg>
        <span id="cart-count" class="absolute -top-2 -right-2 bg-zicada-accent text-white text-xs rounded-full px-1.5 py-0.5 min-w-[18px] text-center">
            {{ cart_total_items|default:0 }}
        </span>
    </a>
</div>

<!-- NOSONAR:Web:S6819 - Usamos role="dialog" porque <dialog> nativo no permite diseño sidebar lateral deslizable -->
<div id="cart-sidebar" 
     class="fixed inset-0 z-50 hidden font-poppins" 
     aria-labelledby="cart-title" 
     role="dialog"
     aria-modal="true"
     data-cart-url="{% url 'orders:cart_data' %}"
     data-cart-update-url="{% url 'orders:cart_update' %}"
     data-cart-remove-url="{% url 'orders:cart_remove' %}"
     data-cart-clear-url="{% url 'orders:cart_clear' %}"
     data-cart-detail-url="{% url 'orders:cart_detail' %}">
    
    <!-- Backdrop con opacidad -->
    <div id="cart-backdrop" class="absolute inset-0 bg-black bg-opacity-0 transition-all duration-300"></div>
    
    <!-- Panel lateral -->
    <div id="cart-sidebar-content" 
         class="absolute right-0 top-0 h-full w-full sm:w-96 md:w-[32rem] bg-neutral-950 shadow-2xl translate-x-full transition-transform duration-300 ease-out flex flex-col text-white">
        
        <!-- Header fijo -->
        <div class="flex justify-between items-center p-5 border-b border-neutral-800 bg-neutral-950 rounded-tl-2xl">
            <h3 id="cart-title" class="text-xl font-bold text-white flex items-center gap-3">
                <svg class="w-6 h-6 text-zicada-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-1.5 6M17 13l1.5 6M9 21h6M6 21h.01M18 21h.01" />
                </svg>
                Mi Carrito
                <span id="cart-sidebar-count" class="text-sm bg-neutral-800 text-neutral-300 px-2 py-0.5 rounded-full">0</span>
            </h3>
            <button id="close-sidebar" class="text-neutral-500 hover:text-white transition w-8 h-8 flex items-center justify-center rounded-full hover:bg-neutral-800">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <!-- Contenedor de notificaciones toast -->
        <div id="cart-toast-container" class="absolute top-20 left-4 right-4 z-10 space-y-2 pointer-events-none">
        </div>

        <!-- Body (scrollable) -->
        <div id="cart-sidebar-body" class="flex-1 overflow-y-auto p-4 bg-black">
            <div class="text-center py-12">
                <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-zicada-accent mx-auto"></div>
                <p class="mt-4 text-neutral-500">Cargando carrito...</p>
            </div>
        </div>

        <!-- Footer fijo -->
        <div id="cart-sidebar-footer" class="border-t border-neutral-800 p-5 bg-neutral-950 shadow-lg rounded-b-2xl">
        </div>
    </div>
</div>

{% block extra_js %}
<script>
    globalThis.cartConfig = {
        csrfToken: "{{ csrf_token|escapejs }}"
    };
</script>
<script src="{% static 'js/orders/cart.js' %}"></script>
{% endblock %}
