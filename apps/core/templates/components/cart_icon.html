{% load static %}

<!-- Icono del carrito -->
<div id="cart-icon-wrapper" class="relative {% if cart_total_items == 0 %}hidden{% endif %}">
    <a href="#" id="cart-icon" class="relative hover:text-zicada-accent transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-1.5 6M17 13l1.5 6M9 21h6M6 21h.01M18 21h.01" />
        </svg>
        <span id="cart-count" class="absolute -top-2 -right-3 bg-zicada-accent text-white text-xs rounded-full px-1.5 py-0.5 min-w-[18px] text-center">
            {{ cart_total_items|default:0 }}
        </span>
    </a>
</div>

<!-- Modal del carrito -->
<div id="cart-modal" 
     class="fixed inset-0 z-50 hidden overflow-y-auto" 
     aria-labelledby="modal-title" 
     role="dialog" 
     aria-modal="true"
     data-cart-url="{% url 'orders:cart_data' %}"
     data-cart-update-url="{% url 'orders:cart_update' %}"
     data-cart-remove-url="{% url 'orders:cart_remove' %}"
     data-cart-clear-url="{% url 'orders:cart_clear' %}"
     data-cart-detail-url="{% url 'orders:cart_detail' %}">
    
    <div class="flex items-center justify-center min-h-screen px-4">
        <!-- Fondo oscuro -->
        <div id="modal-backdrop" class="fixed inset-0 bg-black bg-opacity-50 transition-opacity"></div>

        <!-- Modal content -->
        <div class="relative bg-white rounded-2xl shadow-2xl max-w-lg w-full mx-auto transform transition-all">
            <!-- Header -->
            <div class="flex justify-between items-center p-5 border-b border-gray-100">
                <h3 class="text-xl font-bold text-gray-900 flex items-center gap-2">
                    <svg class="w-5 h-5 text-zicada-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-1.5 6M17 13l1.5 6M9 21h6M6 21h.01M18 21h.01" />
                    </svg>
                    Tu Carrito
                </h3>
                <button id="close-modal" class="text-gray-400 hover:text-gray-600 transition w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100">
                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <!-- Body (contenido dinámico) -->
            <div id="cart-modal-body" class="p-5 max-h-96 overflow-y-auto bg-gray-50">
                <div class="text-center py-8">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-zicada-accent mx-auto"></div>
                    <p class="mt-3 text-gray-500">Cargando carrito...</p>
                </div>
            </div>

            <!-- Footer -->
            <div id="cart-modal-footer" class="border-t border-gray-100 p-5 bg-white rounded-b-2xl"></div>
        </div>
    </div>
</div>

{% block extra_js %}
<script src="{% static 'js/orders/cart.js' %}"></script>
{% endblock %}
