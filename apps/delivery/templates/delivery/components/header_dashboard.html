{% block header %}
<header class="bg-white shadow-sm sticky top-0 z-40">
    <div class="flex items-center justify-between px-4 py-3">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-black rounded-xl flex items-center justify-center">
                <span class="text-white text-xl font-bold">Z</span>
            </div>
            <div>
                <h1 class="text-lg font-bold text-gray-900">Zicada Delivery</h1>
                <p class="text-xs text-gray-500">{{ user.get_full_name|default:user.username }}</p>
            </div>
        </div>
        <form method="POST" action="{% url 'delivery:logout' %}" class="inline">
            {% csrf_token %}
            <button type="submit" class="p-2 rounded-full hover:bg-gray-100 transition" aria-label="Cerrar sesión">
                <i class="fas fa-sign-out-alt text-gray-600"></i>
            </button>
        </form>
    </div>
</header>
{% endblock %}
