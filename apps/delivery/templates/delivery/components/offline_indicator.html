<output id="offlineIndicator" 
        name="connectionStatus"
        class="hidden fixed top-0 left-0 right-0 bg-red-500 text-white text-center py-2 text-sm z-50" 
        for="window"
        aria-live="polite"
        aria-label="Estado de conexión a internet">
    <div class="flex items-center justify-center px-4 space-x-3">
        <i class="fas fa-wifi" aria-hidden="true"></i>
        <span>Sin conexión a internet. Los cambios se sincronizarán automáticamente.</span>
        <button id="dismissOfflineBtn" 
                type="button"
                class="ml-2 text-white hover:text-gray-200 focus:outline-none focus:ring-2 focus:ring-white rounded-full p-1"
                aria-label="Cerrar notificación">
            <i class="fas fa-times" aria-hidden="true"></i>
        </button>
    </div>
</output>
