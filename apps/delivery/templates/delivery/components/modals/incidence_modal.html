<div id="incidenceModal" 
     class="modal fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4 opacity-0 invisible transition" 
     aria-modal="true" 
     aria-labelledby="incidenceModalTitle"
     aria-describedby="incidenceModalDesc">
    <div class="bg-white rounded-xl max-w-sm w-full max-h-[90vh] overflow-y-auto">
        <div class="p-6">
            <div class="text-center mb-4">
                <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-3">
                    <i class="fas fa-flag text-red-600 text-2xl" aria-hidden="true"></i>
                </div>
                <h3 id="incidenceModalTitle" class="text-xl font-bold text-gray-900">Reportar Incidencia</h3>
                <p id="incidenceModalDesc" class="text-gray-600 mt-2">¿Qué sucedió con este pedido?</p>
            </div>
            
            <form method="POST" action="{{ register_incidence_url }}">
                {% csrf_token %}
                
                <div class="space-y-4">
                    <div>
                        <label for="incidenceType" class="block text-sm font-medium text-gray-700 mb-2">
                            Tipo de incidencia <span class="text-red-500" aria-hidden="true">*</span>
                            <span class="sr-only">(requerido)</span>
                        </label>
                        <select id="incidenceType" 
                                name="incidence_type" 
                                required 
                                class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-black focus:border-transparent">
                            <option value="">Selecciona una opción</option>
                            <option value="customer_not_home">🏠 Cliente no estaba</option>
                            <option value="wrong_address">📍 Dirección incorrecta</option>
                            <option value="customer_cancelled">❌ Cliente canceló</option>
                            <option value="product_rejected">📦 Producto rechazado</option>
                            <option value="other">📝 Otro</option>
                        </select>
                    </div>
                    
                    <!-- Comentarios - Textarea con label asociado -->
                    <div>
                        <label for="incidenceComments" class="block text-sm font-medium text-gray-700 mb-2">
                            Comentarios adicionales
                            <span class="text-gray-400 text-xs font-normal">(opcional)</span>
                        </label>
                        <textarea id="incidenceComments" 
                                  name="comments" 
                                  rows="3" 
                                  class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-black focus:border-transparent"
                                  placeholder="Describe lo que sucedió..."></textarea>
                        <p class="text-xs text-gray-500 mt-1">
                            <i class="fas fa-info-circle mr-1" aria-hidden="true"></i>
                            Esta información ayudará al administrador a gestionar el pedido.
                        </p>
                    </div>
                    
                    <!-- Botones de acción -->
                    <div class="flex space-x-3 pt-2">
                        <button type="button" 
                                id="closeIncidenceModalBtn"
                                class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 py-2 rounded-lg font-medium transition-colors focus:outline-none focus:ring-2 focus:ring-gray-400">
                            Cancelar
                        </button>
                        <button type="submit" 
                                name="action" 
                                value="report" 
                                class="flex-1 bg-yellow-500 hover:bg-yellow-600 text-white py-2 rounded-lg font-medium transition-colors focus:outline-none focus:ring-2 focus:ring-yellow-500 focus:ring-offset-2">
                            <i class="fas fa-flag mr-2" aria-hidden="true"></i>
                            Reportar Incidencia
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
