<div class="bg-white rounded-xl shadow-sm p-4 card-hover text-center">
    <div class="w-12 h-12 mx-auto rounded-full flex items-center justify-center mb-2 {{ bg_color|default:'bg-blue-100' }}">
        <i class="fas {{ icon }} {{ icon_color|default:'text-blue-600' }} text-xl"></i>
    </div>
    <p class="text-2xl font-bold text-gray-900">{{ value }}</p>
    <p class="text-xs text-gray-500">{{ label }}</p>
</div>
