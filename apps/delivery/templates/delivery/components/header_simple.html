{% block header %}
<header class="bg-white shadow-sm sticky top-0 z-40">
    <div class="flex items-center justify-between px-4 py-3">
        <div class="flex items-center space-x-3">
            <a href="{{ back_url|default:'#' }}" class="p-2 hover:bg-gray-100 rounded-full transition" aria-label="Volver">
                <i class="fas fa-arrow-left text-gray-600"></i>
            </a>
            <div>
                <h1 class="text-lg font-bold text-gray-900">{{ page_title }}</h1>
                <p class="text-xs text-gray-500">{{ page_subtitle }}</p>
            </div>
        </div>
        <div class="flex items-center space-x-1">
            {% if not hide_refresh %}
            <button id="refreshBtn" class="p-2 rounded-full hover:bg-gray-100 transition" aria-label="Actualizar">
                <i class="fas fa-sync-alt text-gray-600"></i>
            </button>
            {% endif %}
            {% if show_logout %}
            <form method="POST" action="{% url 'delivery:logout' %}" class="inline">
                {% csrf_token %}
                <button type="submit" class="p-2 rounded-full hover:bg-gray-100 transition text-red-600 hover:text-red-700" aria-label="Cerrar sesión">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </form>
            {% endif %}
        </div>
    </div>
</header>
{% endblock %}
