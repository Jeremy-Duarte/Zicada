{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zicada - Sin conexion</title>
    {% include 'components/theme.html' %}
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">
    <div class="text-center">
        <div class="text-6xl mb-4">📡</div>
        <h1 class="text-2xl font-bold text-gray-800 mb-2">Sin conexion</h1>
        <p class="text-gray-600 mb-4">No tienes conexion a internet. Algunas funciones pueden no estar disponibles.</p>
        <button id="retry-btn" class="bg-black text-white px-6 py-2 rounded-lg hover:bg-gray-800 transition focus:outline-none focus:ring-2 focus:ring-black focus:ring-offset-2">
            Reintentar
        </button>
    </div>
    <script>
        document.getElementById('retry-btn').addEventListener('click', function() {
            window.location.reload();
        });
    </script>
</body>
</html>
