{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zicada - Sin conexión</title>
    <link rel="stylesheet" href="{% static 'css/tailwind.css' %}">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">
    <div class="text-center">
        <div class="text-6xl mb-4">📡</div>
        <h1 class="text-2xl font-bold text-gray-800 mb-2">Sin conexión</h1>
        <p class="text-gray-600 mb-4">No tienes conexión a internet. Algunas funciones pueden no estar disponibles.</p>
        <button onclick="window.location.reload()" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition">
            Reintentar
        </button>
    </div>
</body>
</html>
