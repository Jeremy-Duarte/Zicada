[providers]
python = "3.13.13"

[build]
apt = [
    "libgobject-2.0-0",
    "libglib2.0-0",
    "libpango-1.0-0",
    "libpangocairo-1.0-0",
    "libcairo2",
    "libffi-dev",
    "libjpeg-dev",
    "libpng-dev",
    "zlib1g-dev"
]

[start]
cmd = "python manage.py collectstatic --noinput && gunicorn --bind 0.0.0.0:$PORT config.wsgi:application"