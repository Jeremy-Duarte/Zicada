name: Zicada Agent
version: 1.0.0
schema: v1

models:
  - name: DeepSeek V4 Flash
    provider: deepseek
    model: deepseek-v4-flash
    apiKey: ${{ secrets.DEEPSEEK_API_KEY }}
    apiBase: https://api.deepseek.com
    roles:
      - chat
      - edit
      - apply
    defaultCompletionOptions:
      maxTokens: 8000
      temperature: 0.1

  - name: DeepSeek V4 Pro Reasoner
    provider: deepseek
    model: deepseek-v4-pro
    apiKey: ${{ secrets.DEEPSEEK_API_KEY }}
    apiBase: https://api.deepseek.com
    roles:
      - chat
      - edit
      - apply
    capabilities:
      - tool_use
    defaultCompletionOptions:
      maxTokens: 32000
      temperature: 0.3
    requestOptions:
      timeout: 120000
      body:
        thinking:
          type: enabled
        reasoning_effort: high

  - name: Qwen Coder 7B Local
    provider: ollama
    model: qwen2.5-coder:7b
    apiBase: http://localhost:11434
    roles:
      - chat
      - edit
    defaultCompletionOptions:
      maxTokens: 2000
      temperature: 0.2

  - name: Qwen Autocomplete
    provider: ollama
    model: qwen2.5-coder:7b
    apiBase: http://localhost:11434
    roles:
      - autocomplete
    autocompleteOptions:
      debounceDelay: 250
      maxPromptTokens: 4000
      onlyMyCode: true

  - name: Llama 3.2
    provider: ollama
    model: llama3.2:3b
    apiBase: http://localhost:11434
    roles:
      - chat
    defaultCompletionOptions:
      maxTokens: 2000
      temperature: 0.3

agent:
  enabled: true
  model: DeepSeek V4 Pro Reasoner
  autoRun: true
  maxSteps: 10

tabAutocompleteModel:
  model: Qwen Autocomplete

tabAutocompleteOptions:
  disable: false
  useCopyBuffer: true
  maxPromptTokens: 4000
  prefixPercentage: 0.5

rules:
  - Use English for all code
  - Spanish only for user-facing messages
  - Django: Always use select_related and prefetch_related
  - Tailwind: Utility classes only, no custom CSS
  - KISS: Max 15 lines per function, single responsibility
  - DRY: Extract repeated logic to utils or services
  - Validate all inputs at form or serializer level
  - Use Django messages framework for user feedback
  - Type hints required for all function signatures

prompts:
  - path: prompts/atomic-refactor.prompt
  - path: prompts/tailwind-extract.prompt
  - path: prompts/business-review.prompt
  - path: prompts/form-validation.prompt
  - path: prompts/optimize-queries.prompt
  - path: prompts/tests-generate.prompt

context:
  - provider: code
  - provider: file
  - provider: diff
  - provider: terminal

experimental:
  enableTools: true
  enableAgentMode: true